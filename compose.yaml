services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: karyanesia
      POSTGRES_USER: karyanesia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U karyanesia -d karyanesia']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    image: karyanesia-api:local
    command: [node, apps/api/dist/migrate.js]
    environment:
      DATABASE_URL: postgresql://karyanesia:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/karyanesia
      WEB_ORIGIN: ${WEB_ORIGIN:?Set WEB_ORIGIN}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?Set MFA_ENCRYPTION_KEY}
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
  api:
    image: karyanesia-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://karyanesia:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/karyanesia
      WEB_ORIGIN: ${WEB_ORIGIN:?Set WEB_ORIGIN}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?Set MFA_ENCRYPTION_KEY}
      NODE_ENV: ${NODE_ENV:-development}
      DEMO: ${DEMO:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      PORT: '4000'
      CLAMAV_HOST: clamav
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
    ports:
      - '127.0.0.1:${API_PORT:-4000}:4000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, node, apps/api/dist/healthcheck.js, api]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
  worker:
    image: karyanesia-api:local
    command: [node, apps/api/dist/worker.js]
    environment:
      DATABASE_URL: postgresql://karyanesia:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/karyanesia
      WEB_ORIGIN: ${WEB_ORIGIN:?Set WEB_ORIGIN}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?Set MFA_ENCRYPTION_KEY}
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, node, apps/api/dist/healthcheck.js, worker]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    restart: unless-stopped
  clamav:
    image: clamav/clamav:stable
    volumes:
      - clamav_signatures:/var/lib/clamav
    restart: unless-stopped
  bootstrap:
    profiles: [setup]
    image: karyanesia-api:local
    environment:
      DATABASE_URL: postgresql://karyanesia:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/karyanesia
      WEB_ORIGIN: ${WEB_ORIGIN:?Set WEB_ORIGIN}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?Set MFA_ENCRYPTION_KEY}
      NODE_ENV: ${NODE_ENV:-development}
      BOOTSTRAP_TENANT_CODE: ${BOOTSTRAP_TENANT_CODE:-}
      BOOTSTRAP_TENANT_NAME: ${BOOTSTRAP_TENANT_NAME:-}
      BOOTSTRAP_EMPLOYEE_NUMBER: ${BOOTSTRAP_EMPLOYEE_NUMBER:-}
      BOOTSTRAP_FULL_NAME: ${BOOTSTRAP_FULL_NAME:-}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:-}
    command: [node, apps/api/dist/bootstrap.js]
    depends_on:
      migrate:
        condition: service_completed_successfully
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:4000
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
volumes:
  postgres_data:
  clamav_signatures:
