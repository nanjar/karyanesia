name: CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: karyanesia
          POSTGRES_PASSWORD: ci-ephemeral-password
          POSTGRES_DB: karyanesia_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U karyanesia -d karyanesia_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:ops
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://karyanesia:ci-ephemeral-password@localhost:5432/karyanesia_test
      - name: PostgreSQL backup and restore smoke test
        run: node scripts/restore-smoke.mjs
        env:
          TEST_DATABASE_URL: postgresql://karyanesia:ci-ephemeral-password@localhost:5432/karyanesia_test
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
      - run: npm run build
  docker-smoke:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck:e2e -w @karyanesia/web
      - run: npx playwright install --with-deps chromium webkit
      - name: Build and verify Docker services and browser flows
        run: bash scripts/docker-smoke.sh
        env:
          RUN_BROWSER_TESTS: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-qa
          path: |
            qa-artifacts/playwright-report
            qa-artifacts/test-results
          retention-days: 7
          if-no-files-found: ignore
