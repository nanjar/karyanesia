name: CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: karyanesia
          POSTGRES_PASSWORD: ci-ephemeral-password
          POSTGRES_DB: karyanesia_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U karyanesia -d karyanesia_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://karyanesia:ci-ephemeral-password@localhost:5432/karyanesia_test
      - run: npm run build
